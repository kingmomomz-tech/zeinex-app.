name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build APK using webapp-to-apk
        run: |
          npx webapp-to-apk --manifest ./index.html --app-name "Zeinex" --package-name "com.zeinex.app" --icon ./index.html

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zeinex-APK
          path: output/*.apk
